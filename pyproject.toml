[project]
name = "vigil-soc"
version = "0.1.0"
description = "Open-source AI copilot for security operations: triage alerts, enrich context, draft Sigma/YARA detections with a prompt-injection-resilient LLM pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vigil maintainers" }]
keywords = ["security", "soc", "llm", "triage", "detection-engineering", "claude", "soc-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
vigil = "vigil.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's declarative Argument/Option defaults are the framework idiom.
"src/vigil/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
